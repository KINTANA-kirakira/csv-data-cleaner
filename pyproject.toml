[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-data-cleaner"
version = "0.1.0"
description = "CSVデータの重複削除、列整理、並び替えを自動化するPythonツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
csv-data-cleaner = "csv_data_cleaner.cli:main"
csv-render-image = "csv_data_cleaner.render_csv_image:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
